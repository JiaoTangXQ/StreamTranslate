# Deployment template: replace the documentation-only IP with your own TLS host.
server {
    listen 443 ssl;
    server_name 192.0.2.1;
    ssl_certificate /etc/streamtranslate-certificates/live/streamtranslate/fullchain.pem;
    ssl_certificate_key /etc/streamtranslate-certificates/live/streamtranslate/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StreamTranslateTLS:1m;
    access_log off;
    error_log /var/log/nginx/streamtranslate-error.log crit;
    client_max_body_size 256k;
    client_body_timeout 10s;
    send_timeout 15s;
    location / {
        proxy_pass http://127.0.0.1:18447;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
