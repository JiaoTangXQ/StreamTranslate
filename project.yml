name: StreamTranslate
options:
  bundleIdPrefix: com.jiaotangxq
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40.0"

packages:
  CompanionKit:
    path: CompanionKit
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.0.0"

schemes:
  StreamTranslatePhone:
    build:
      targets:
        StreamTranslatePhone: all
    test:
      targets:
        - StreamTranslatePhoneUITests
      gatherCoverageData: true
      parallelizable: false

targets:
  StreamTranslatePhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StreamTranslatePhone
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiaotangxq.StreamTranslate.Phone
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: StreamTranslatePhone/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: CompanionKit
        product: CompanionKit

  StreamTranslatePhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - StreamTranslatePhoneUITests
    dependencies:
      - target: StreamTranslatePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiaotangxq.StreamTranslate.PhoneUITests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StreamTranslatePhone
        TARGETED_DEVICE_FAMILY: "1"

  StreamTranslate:
    type: application
    platform: macOS
    sources:
      - StreamTranslate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiaotangxq.StreamTranslate
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "22"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: StreamTranslate/Bridge/StreamTranslate-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: StreamTranslate/Resources/StreamTranslate.entitlements
        INFOPLIST_FILE: StreamTranslate/Resources/Info.plist
        CODE_SIGN_IDENTITY: "-"
        # DEVELOPMENT_TEAM is intentionally unset. The default `-` identity is
        # ad-hoc signing, which requires no team. When a contributor opens the
        # project in Xcode and hits Run, Xcode's Signing & Capabilities tab
        # lets them flip to automatic signing with their own Apple ID Personal
        # Team in one click — the choice lives in xcuserdata and is not
        # committed. CLI builds (`xcodebuild test` etc.) keep using ad-hoc so
        # CI and contributor machines with no signed-in Apple ID still pass.
      configs:
        Release:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - package: CompanionKit
        product: CompanionKit
      - package: WhisperKit
        product: WhisperKit
    entitlements:
      path: StreamTranslate/Resources/StreamTranslate.entitlements

  StreamTranslateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - StreamTranslateTests
    dependencies:
      - target: StreamTranslate
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  StreamTranslateASRBench:
    type: tool
    platform: macOS
    sources:
      - path: Tools/ASRBenchmarkMain.swift
      - path: StreamTranslate/Services/AppleStreamingTranscriptionService.swift
      - path: StreamTranslate/Services/SpeechFinalizationPlanner.swift
      - path: StreamTranslate/Services/WhisperTranscriptionService.swift
      - path: StreamTranslate/Models/CaptionTextStabilizer.swift
      - path: StreamTranslate/Models/TranscriptionTypes.swift
      - path: StreamTranslate/Models/SpokenLanguage.swift
      - path: StreamTranslate/Models/TranslationDraftPlanner.swift
      - path: StreamTranslate/Utilities/AppLogger.swift
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiaotangxq.StreamTranslate.ASRBench
        SWIFT_VERSION: "6.0"

  StreamTranslateTranslationBench:
    type: tool
    platform: macOS
    sources:
      - path: Tools/TranslationBenchmarkMain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiaotangxq.StreamTranslate.TranslationBench
        SWIFT_VERSION: "6.0"

  StreamTranslateNemotronBench:
    type: tool
    platform: macOS
    sources:
      - path: Tools/NemotronBenchmarkMain.swift
      - path: StreamTranslate/Bridge
      - path: StreamTranslate/Services/NemotronStreamingTranscriptionService.swift
      - path: StreamTranslate/Models/TranscriptionTypes.swift
      - path: StreamTranslate/Models/SpokenLanguage.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiaotangxq.StreamTranslate.NemotronBench
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: StreamTranslate/Bridge/StreamTranslate-Bridging-Header.h
